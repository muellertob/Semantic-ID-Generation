# Global-temporal-split variant of amazon_toy.yaml; the quantizer fits on the stage-1 items only.
# data loader configuration
data:
  dataset: "amazon"
  batch_size: 256
  input_normalization: "none" # none | center | center_l2 | std_l2
  category: "toys"
  split: "train"
  split_protocol: "gts" # global temporal split
  gts_q_test: 0.9
  gts_q_val: 0.9

# model configuration (FSQ)
model:
  quantizer_type: "fsq"
  input_dimension: 768
  hidden_dimensions: [512, 256, 128]
  latent_dimension: 30            # FSQ bottleneck dim (divisible by num_layers=3)
  codebook_layers: 3              # Equivalent to number of layers/tokens
  level_list: [8, 6, 6]           # Bound dimensions per step (8*6*6 = 288 combinations)
  loss_type: l1
  normalize_inputs: True          # VAE model-internal input normalization layer (BatchNorm + L2 Norm)

# training configuration (FSQ)
train:
  optimizer: "adam"
  learning_rate: 1e-3
  weight_decay: 0
  num_epochs: 2000
  use_lr_scheduler: False

# additional configuration
general:
  seed: 10
  sid_type: "FSQ"
  use_wandb: True
  wandb_log_artifacts: False
  wandb_project_quantizer: "mt-amazon-quantizer"
  wandb_entity: "tobias-mueller99-johannes-kepler-universit-t-linz"
  save_model: True
