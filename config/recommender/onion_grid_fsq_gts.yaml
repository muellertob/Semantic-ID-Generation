# Music4All-Onion variant of amazon_toy_grid_fsq_gts.yaml: the same reference Stage 2 with the same 100k-step budget.
# data loader configuration
data:
  dataset: "music4all_onion"
  split_protocol: "gts" # global temporal split
  gts_q_test: 0.9
  gts_q_val: 0.9

# seq2seq configuration (TIGER paper implementation)
seq2seq:
  d_model: 128
  d_kv: 64
  d_ff: 1024
  num_layers: 4
  num_heads: 6
  dropout: 0.1
  activation_fn: "relu"
  
  # optimization
  learning_rate: 5e-4
  weight_decay: 1e-6
  use_lr_scheduler: False
  batch_size: 256
  
  # data
  max_history_len: 20
  user_tokens: 0
  codebook_layers: 3
  codebook_size: 288
  data_augmentation: True
  
  # training loop
  num_epochs: 1961 # x 51 steps (12,930 train rows / batch 256) = 100k steps, the Toys budget
  eval_epoch_interval: 5
  eval_delay_epochs: 200 # x 51 steps = 10,200 steps, as 150 x 68 on Toys
  early_stopping: False
  checkpoint_metric:
    metric: ndcg # recall | ndcg
    k: 10 # 5 | 10
  early_stopping_patience: 15
  resume_optimizer: True
  num_workers: 4

# additional configuration
general:
  seed: 10
  compile: True
  use_wandb: True
  wandb_log_artifacts: False
  wandb_project_recommender: "mt-onion-recommender"
  wandb_project_quantizer: "mt-onion-quantizer" # link to the parent Stage-1 run
  wandb_entity: "tobias-mueller99-johannes-kepler-universit-t-linz"
  save_model: True
